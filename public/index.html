<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <title>BROK</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07070a;color:#fff}
    *{box-sizing:border-box}body{margin:0;background:#07070a;min-height:100vh}button,textarea,input{font:inherit}button{cursor:pointer}
    header{position:sticky;top:0;z-index:2;padding:16px;border-bottom:1px solid #202026;background:rgba(7,7,10,.92);backdrop-filter:blur(16px)}
    .bar{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:#fff;color:#000;display:grid;place-items:center;font-size:20px;font-weight:900}.name{font-weight:700}.sub{font-size:9px;color:#777782;letter-spacing:.18em;text-transform:uppercase}.status{font-size:11px;color:#85858f;display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#b7ff3c}
    main{max-width:760px;margin:auto;min-height:calc(100vh - 71px);padding:30px 16px 18px;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:70px;text-align:center}.heroIcon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#fff,#777);color:#000;display:grid;place-items:center;margin:0 auto 20px;font-size:30px}.hero h1{font-size:36px;letter-spacing:-.045em;margin:0}.hero p{color:#85858f;font-size:14px;line-height:1.7;max-width:600px;margin:12px auto 24px}.prompts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.prompt{background:#0d0d11;border:1px solid #24242c;color:#b5b5be;padding:14px;border-radius:17px;text-align:left;font-size:13px}.messages{flex:1;padding-bottom:20px}.msg{margin:0 0 24px;display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:88%;font-size:15px;line-height:1.7;white-space:pre-wrap}.user .bubble{background:#fff;color:#000;border-radius:22px 22px 5px 22px;padding:11px 16px}.assistant .bubble{padding:4px 2px;color:#e5e5ea}.thinking{font-size:12px;color:#777782;display:flex;gap:7px;align-items:center}.thinking i{width:7px;height:7px;border-radius:50%;background:#b7ff3c;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
    form{position:sticky;bottom:8px;background:#101014;border:1px solid #292930;border-radius:24px;padding:8px;box-shadow:0 16px 45px #0009}.row{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;resize:none;min-height:48px;max-height:140px;border:0;outline:0;background:transparent;color:#fff;padding:13px;font-size:14px}textarea::placeholder{color:#5f5f69}.send{width:48px;height:48px;border:0;border-radius:16px;background:#fff;color:#000;font-size:20px}.send:disabled{opacity:.3}.hint{font-size:9px;color:#55555f;padding:3px 13px 2px}.settings{margin-top:10px;border:1px solid #292930;border-radius:18px;background:#0d0d11;padding:12px}.settings summary{font-size:12px;color:#aaa;cursor:pointer}.settings input{width:100%;margin-top:10px;background:#07070a;border:1px solid #292930;color:#fff;border-radius:12px;padding:11px;font-size:12px}.save{margin-top:8px;width:100%;padding:10px;border:0;border-radius:12px;background:#222;color:#fff;font-size:12px}
    @media(max-width:600px){.hero h1{font-size:31px}.prompts{grid-template-columns:1fr}.status{display:none}}
  </style>
</head>
<body>
<header><div class="bar"><div class="brand"><div class="logo">✦</div><div><div class="name">BROK</div><div class="sub">Compound AI</div></div></div><div class="status"><span class="dot"></span> Live web + tools</div></div></header>
<main>
  <div id="messages" class="messages"></div>
  <section id="hero" class="hero">
    <div class="heroIcon">✦</div><h1>What are we figuring out?</h1><p>Fast, opinionated AI with Groq Compound. BROK can use live web search, visit websites and run code when the task needs it.</p>
    <div class="prompts"><button class="prompt" data-p="What is happening in AI right now?">What is happening in AI right now?</button><button class="prompt" data-p="Research the best free tools for building an AI agent.">Research the best free AI agent tools.</button><button class="prompt" data-p="Help me turn an idea into a real product.">Turn an idea into a real product.</button></div>
  </section>
  <form id="form"><div class="row"><textarea id="input" rows="1" placeholder="Ask BROK anything…"></textarea><button class="send" id="send" type="submit">↑</button></div><div class="hint">Personal Android build • API keys are stored only on this device</div></form>
  <details class="settings"><summary>⚙ API keys</summary><input id="key1" type="password" placeholder="Groq API key 1"><input id="key2" type="password" placeholder="Groq API key 2 (fallback)"><button class="save" id="save">Save keys on this device</button></details>
</main>
<script>
const KEY1='brok_groq_1',KEY2='brok_groq_2';
const input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages'),hero=document.getElementById('hero'),form=document.getElementById('form');
const key1=document.getElementById('key1'),key2=document.getElementById('key2');
key1.value=localStorage.getItem(KEY1)||'';key2.value=localStorage.getItem(KEY2)||'';
document.getElementById('save').onclick=()=>{localStorage.setItem(KEY1,key1.value.trim());localStorage.setItem(KEY2,key2.value.trim());alert('Saved on this device.');};
let history=[];
function add(role,text){hero.style.display='none';const el=document.createElement('div');el.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;el.appendChild(b);messages.appendChild(el);window.scrollTo(0,document.body.scrollHeight);return el}
function compactHistory(){return history.slice(-10).map(m=>({role:m.role,content:String(m.content).slice(0,6000)}));}
async function groqRequest(key,model){
  const payload={model,messages:[{role:'system',content:'You are BROK, a fast, direct, highly capable AI assistant. Use Compound tools when useful. Be practical, decisive and honest. Prefer actionable answers over generic explanations.'},...compactHistory()]};
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(payload)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const err=new Error(d.error?.message||`Groq request failed (${r.status})`);err.status=r.status;throw err}
  return d;
}
async function ask(text){const value=text.trim();if(!value)return;const keys=[localStorage.getItem(KEY1),localStorage.getItem(KEY2)].filter(Boolean);if(!keys.length){document.querySelector('.settings').open=true;add('assistant','⚠️ Add a Groq API key in Settings first.');return}add('user',value);history.push({role:'user',content:value});input.value='';send.disabled=true;const wait=add('assistant','');wait.querySelector('.bubble').innerHTML='<span class="thinking"><i></i> Thinking + searching…</span>';
let lastErr='Request failed';
for(const key of keys){try{
  let d;
  try{d=await groqRequest(key,'groq/compound')}
  catch(e){
    // Groq can reject an oversized Compound request. Retry the same key with the smaller Compound model after trimming context.
    if(e.status===413){history=history.slice(-6);d=await groqRequest(key,'groq/compound-mini')}else throw e
  }
  const text=d.choices?.[0]?.message?.content||'No response.';wait.remove();add('assistant',text);history.push({role:'assistant',content:text});send.disabled=false;return
}catch(e){lastErr=e.message||lastErr}}
wait.remove();add('assistant','⚠️ '+lastErr+(keys.length>1?' (both Groq keys failed)':''));send.disabled=false}
form.onsubmit=e=>{e.preventDefault();ask(input.value)};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}};document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>ask(b.dataset.p));
</script>
</body>
</html>
