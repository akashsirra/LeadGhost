<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>BROK</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07070a;color:#f5f5f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07070a}body{min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}header{position:sticky;top:0;z-index:10;background:rgba(7,7,10,.88);backdrop-filter:blur(20px);border-bottom:1px solid #18181d}.bar{height:58px;max-width:760px;margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:17px;font-weight:800;letter-spacing:-.03em}.sub{font-size:8px;font-weight:500;letter-spacing:.18em;color:#66666f;text-transform:uppercase;margin-top:2px}.gear{width:34px;height:34px;border:0;background:transparent;color:#777780;font-size:17px}.modes{max-width:760px;margin:auto;padding:0 18px 9px;display:flex;gap:16px}.modes button{border:0;background:none;color:#62626b;padding:0;font-size:10px}.modes button.active{color:#fff}.modes button.agent.active{color:#b7ff3c}main{max-width:760px;margin:auto;min-height:calc(100vh - 88px);padding:0 18px 18px;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 0 70px}.mark{width:44px;height:44px;border-radius:14px;background:#fff;color:#000;display:grid;place-items:center;font-size:20px;margin-bottom:22px}.hero h1{font-size:38px;line-height:1;letter-spacing:-.06em;margin:0}.hero p{max-width:430px;color:#686870;font-size:12px;line-height:1.6;margin:12px 0 25px}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.quick button{border:1px solid #24242a;background:#0d0d11;color:#a2a2aa;border-radius:999px;padding:9px 13px;font-size:10px}.messages{flex:1;padding:22px 0 20px}.msg{margin-bottom:22px;display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:88%;font-size:15px;line-height:1.65;white-space:pre-wrap}.user .bubble{background:#fff;color:#000;border-radius:20px 20px 5px 20px;padding:10px 14px}.assistant .bubble{color:#e5e5e8}.thinking{font-size:11px;color:#66666f}.thinking i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b7ff3c;margin-right:7px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}.tool{display:inline-block;margin:7px 5px 0 0;padding:4px 7px;border:1px solid #25252b;border-radius:8px;color:#686871;font-size:8px}form{position:sticky;bottom:10px;border:1px solid #25252b;background:#101014;border-radius:22px;padding:7px;box-shadow:0 16px 50px #000b}.row{display:flex;align-items:flex-end;gap:7px}textarea{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:12px;font-size:14px}textarea::placeholder{color:#55555e}.send{width:46px;height:46px;border:0;border-radius:15px;background:#fff;color:#000;font-size:19px}.send:disabled{opacity:.3}.meta{display:flex;justify-content:space-between;padding:2px 11px 1px;font-size:8px;color:#4f4f57}.settings{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:#000c}.settings.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto auto 0;background:#101014;border:1px solid #292930;border-bottom:0;border-radius:22px 22px 0 0;padding:17px;max-height:82vh;overflow:auto}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheetTitle{font-size:14px;font-weight:750}.close{border:0;background:#202027;color:#aaa;width:32px;height:32px;border-radius:10px}.sheet p{font-size:9px;line-height:1.5;color:#666;margin:0 0 13px}.settings label{display:block;font-size:9px;color:#777;margin-top:10px}.settings input{width:100%;margin-top:5px;background:#07070a;border:1px solid #292930;border-radius:11px;color:#fff;padding:11px;font-size:11px;outline:0}.save{width:100%;margin-top:10px;border:0;border-radius:11px;background:#222;color:#fff;padding:11px;font-size:11px}.save.ok{background:#b7ff3c;color:#000}.save.error{background:#572020}.saveStatus{min-height:14px;margin-top:6px;font-size:9px;color:#777}.saveStatus.ok{color:#b7ff3c}.saveStatus.error{color:#ff9292}.security{border-top:1px solid #202027;margin-top:12px;padding-top:10px;font-size:8px;color:#505059;line-height:1.5}@media(max-width:600px){.hero h1{font-size:36px}.hero{padding-bottom:55px}.quick button{font-size:9px}}
</style>
</head>
<body>
<header><div class="bar"><div><div class="brand">BROK</div><div class="sub">Personal AI</div></div><button class="gear" id="settingsBtn" type="button" aria-label="Settings">⚙</button></div><div class="modes"><button id="fastMode" class="active" type="button">Fast</button><button id="astraMode" type="button">Astra</button><button id="agentMode" class="agent" type="button">Agent</button></div></header>
<main>
<div id="messages" class="messages"></div>
<section id="hero" class="hero"><div class="mark">✦</div><h1>What's on your mind?</h1><p>Ask BROK to research, build, or act. No setup on the home screen.</p><div class="quick"><button type="button" data-p="Research what matters in AI today.">Research</button><button type="button" data-p="Help me build something useful today.">Build</button><button type="button" data-p="Open my GitHub repo: https://github.com/akashsirra/LeadGhost">Act</button></div></section>
<form id="form"><div class="row"><textarea id="input" rows="1" placeholder="Ask BROK…"></textarea><button class="send" id="send" type="submit">↑</button></div><div class="meta"><span id="hint">Fast · Groq</span><span>Enter ↵</span></div></form>
</main>
<div class="settings" id="settingsModal"><div class="sheet"><div class="sheetHead"><div class="sheetTitle">Settings</div><button class="close" id="settingsClose" type="button">×</button></div><p>Keys stay on this device. You only need to enter them once.</p><div class="settings"><label>OpenAI API key</label><input id="openaiKey" type="password" autocomplete="off" placeholder="sk-…"><label>Groq API key 1</label><input id="key1" type="password" autocomplete="off" placeholder="Groq API key 1"><label>Groq API key 2 · fallback</label><input id="key2" type="password" autocomplete="off" placeholder="Groq API key 2"><button class="save" id="save" type="button">Save</button><div id="saveStatus" class="saveStatus"></div></div><div class="security">Stored in app-private Android storage. For a public release, move API secrets behind a server.</div></div></div>
<script src="native-storage.js"></script>
<script>
const OKEY='brok_openai',KEY1='brok_groq_1',KEY2='brok_groq_2';
const input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages'),hero=document.getElementById('hero'),form=document.getElementById('form'),hint=document.getElementById('hint');
const openaiKey=document.getElementById('openaiKey'),key1=document.getElementById('key1'),key2=document.getElementById('key2'),save=document.getElementById('save'),saveStatus=document.getElementById('saveStatus');
const settingsModal=document.getElementById('settingsModal');
document.getElementById('settingsBtn').onclick=()=>settingsModal.classList.add('open');document.getElementById('settingsClose').onclick=()=>settingsModal.classList.remove('open');settingsModal.onclick=e=>{if(e.target===settingsModal)settingsModal.classList.remove('open')};
const memoryStore={};let storageDbPromise=null;
function localRead(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}function localWrite(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function openDb(){if(storageDbPromise)return storageDbPromise;storageDbPromise=new Promise((resolve,reject)=>{try{const r=indexedDB.open('brok_storage',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}});return storageDbPromise}
async function idbRead(k){const db=await openDb();return new Promise((res,rej)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>res(r.result||'');r.onerror=()=>rej(r.error)})}
async function idbWrite(k,v){const db=await openDb();return new Promise((res,rej)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function readStore(k){return memoryStore[k]??localRead(k)}function writeStore(k,v){memoryStore[k]=v;localWrite(k,v)}
async function hydrate(){try{for(const k of [OKEY,KEY1,KEY2,'brok_notes']){const v=await idbRead(k);if(v!==''&&!readStore(k))memoryStore[k]=v}}catch(e){}openaiKey.value=readStore(OKEY);key1.value=readStore(KEY1);key2.value=readStore(KEY2)}hydrate();
function saveMsg(t,ok){saveStatus.textContent=t;saveStatus.className='saveStatus '+(ok?'ok':'error');save.className='save '+(ok?'ok':'error');setTimeout(()=>save.className='save',1800)}
save.onclick=async()=>{save.disabled=true;save.textContent='Saving…';try{for(const [k,v] of [[OKEY,openaiKey.value.trim()],[KEY1,key1.value.trim()],[KEY2,key2.value.trim()]]){writeStore(k,v);await idbWrite(k,v)}saveMsg('✓ Saved on this device.',true)}catch(e){saveMsg('Save failed: '+(e.message||String(e)),false)}finally{save.disabled=false;save.textContent='Save'}};
let mode='fast',previousResponseId=null,history=[];
const system='You are BROK, a decisive personal AI agent inside an Android app. Be concise, practical and honest. In Astra mode research current facts when needed. In Agent mode use phone tools only when useful. Never claim an action happened unless a tool succeeded. Ask confirmation before irreversible, financial, destructive or external side-effect actions.';
function add(role,text){hero.style.display='none';const el=document.createElement('div');el.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;el.appendChild(b);messages.appendChild(el);window.scrollTo(0,document.body.scrollHeight);return el}
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));document.getElementById(m==='fast'?'fastMode':m==='astra'?'astraMode':'agentMode').classList.add('active');hint.textContent=m==='fast'?'Fast · Groq':m==='astra'?'Astra · deep reasoning':'Agent · phone actions'}
document.getElementById('fastMode').onclick=()=>setMode('fast');document.getElementById('astraMode').onclick=()=>setMode('astra');document.getElementById('agentMode').onclick=()=>setMode('agent');
function hist(){return history.slice(-10).map(x=>({role:x.role,content:String(x.content).slice(0,6000)}))}
async function groq(key){const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'groq/compound',messages:[{role:'system',content:system},...hist()]})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error?.message||('Groq failed '+r.status));e.status=r.status;throw e}return d}
const tools=[{type:'web_search_preview'},{type:'function',name:'open_url',description:'Open a URL in the Android browser.',parameters:{type:'object',properties:{url:{type:'string'}},required:['url']}},{type:'function',name:'copy_text',description:'Copy text to the Android clipboard.',parameters:{type:'object',properties:{text:{type:'string'}},required:['text']}},{type:'function',name:'share_text',description:'Open the Android share sheet.',parameters:{type:'object',properties:{text:{type:'string'},title:{type:'string'}},required:['text','title']}},{type:'function',name:'save_note',description:'Save a local note on this device.',parameters:{type:'object',properties:{title:{type:'string'},text:{type:'string'}},required:['title','text']}},{type:'function',name:'launch_android_app',description:'Launch an Android app when explicitly requested.',parameters:{type:'object',properties:{package_name:{type:'string'},fallback_url:{type:'string'}},required:['package_name','fallback_url']}}];
async function phoneTool(name,a){try{if(name==='open_url'){const u=String(a.url||'');if(!/^https?:\\/\\//i.test(u))return{ok:false,error:'Only http/https URLs are allowed'};window.open(u,'_blank');return{ok:true,action:'opened_url'}}if(name==='copy_text'){await navigator.clipboard.writeText(String(a.text||''));return{ok:true,action:'copied'}}if(name==='share_text'){if(!navigator.share)return{ok:false,error:'Share sheet unavailable'};await navigator.share({title:String(a.title||'BROK'),text:String(a.text||'')});return{ok:true,action:'shared'}}if(name==='save_note'){const n=JSON.parse(readStore('brok_notes')||'[]');n.push({title:String(a.title||'BROK note'),text:String(a.text||''),createdAt:new Date().toISOString()});const v=JSON.stringify(n.slice(-100));writeStore('brok_notes',v);await idbWrite('brok_notes',v);return{ok:true,action:'saved_note'}}if(name==='launch_android_app'){const p=String(a.package_name||'');if(!/^[A-Za-z0-9_.]+$/.test(p))return{ok:false,error:'Invalid package name'};window.location.href='intent://#Intent;package='+p+';end';return{ok:true,action:'launch_requested'}}return{ok:false,error:'Unknown tool'}}catch(e){return{ok:false,error:e.message||String(e)}}}
function outputText(d){if(d.output_text)return d.output_text;return(d.output||[]).filter(x=>x.type==='message').flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join('\n')||'No response.'}
async function astra(value,agent){const key=readStore(OKEY);if(!key)throw new Error('Open Settings and add your OpenAI API key.');let body={model:'gpt-6-astra',instructions:system,reasoning:{effort:agent?'high':'medium'},input:value,tools:agent?tools:[{type:'web_search_preview'}],parallel_tool_calls:true};if(previousResponseId)body.previous_response_id=previousResponseId;for(let round=0;round<6;round++){const r=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||('OpenAI failed '+r.status));previousResponseId=d.id;const calls=(d.output||[]).filter(x=>x.type==='function_call');if(!calls.length)return{text:outputText(d),tools:[]};const used=[],outs=[];for(const c of calls){used.push(c.name);const args=JSON.parse(c.arguments||'{}');outs.push({type:'function_call_output',call_id:c.call_id,output:JSON.stringify(await phoneTool(c.name,args))})}body={model:'gpt-6-astra',instructions:system,previous_response_id:d.id,input:outs,tools,parallel_tool_calls:true}}throw new Error('Agent stopped after too many actions.')}
async function ask(text){const v=text.trim();if(!v)return;add('user',v);history.push({role:'user',content:v});input.value='';send.disabled=true;const wait=add('assistant','');wait.querySelector('.bubble').innerHTML='<span class="thinking"><i></i>'+(mode==='fast'?'Thinking…':'Working…');try{let out='',used=[];if(mode==='fast'){const keys=[readStore(KEY1),readStore(KEY2)].filter(Boolean);if(!keys.length)throw new Error('Open Settings and add a Groq API key.');let err;for(const k of keys){try{const d=await groq(k);out=d.choices?.[0]?.message?.content||'No response.';break}catch(e){err=e}}if(!out)throw err||new Error('Groq failed')}else{const r=await astra(v,mode==='agent');out=r.text;used=r.tools}wait.remove();const el=add('assistant',out);if(used.length){const meta=document.createElement('div');meta.innerHTML=used.map(x=>'<span class="tool">'+x+'</span>').join('');el.appendChild(meta)}history.push({role:'assistant',content:out})}catch(e){wait.remove();add('assistant','⚠ '+(e.message||String(e)))}send.disabled=false}
form.onsubmit=e=>{e.preventDefault();ask(input.value)};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}};document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>ask(b.dataset.p));
</script>
</body>
</html>
