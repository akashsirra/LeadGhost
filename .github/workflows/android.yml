name: Build BROK Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'HTTPS URL of the deployed BROK web app'
        required: true
        type: string
  push:
    branches:
      - feat/brok-android

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.BROK_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate app URL
        run: |
          if [ -z "$CAPACITOR_SERVER_URL" ]; then
            echo "BROK_APP_URL repository variable or workflow server_url input is required."
            exit 1
          fi
          case "$CAPACITOR_SERVER_URL" in
            https://*) ;;
            *) echo "CAPACITOR_SERVER_URL must use HTTPS"; exit 1;;
          esac

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BROK-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
