name: Build BROK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/brok-android
      - feat/brok-astra-agent

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install BROK native Android storage bridge
        run: bash scripts/install-android-storage.sh

      - name: Add visible settings fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          marker = '</body>'
          patch = '''<style>#settingsFallback{position:fixed;top:66px;right:16px;z-index:25;width:38px;height:38px;border:1px solid #333;background:#0d0d0f;color:#fff;border-radius:12px;font-size:16px;display:grid;place-items:center}#settingsFallback:active{background:#fff;color:#000}.settings.open{align-items:center}.settings.open .sheet{margin:auto;max-height:90vh;border-bottom:1px solid #292930;border-radius:22px}.sheet>.settings{position:static;inset:auto;z-index:auto;display:block;background:transparent}.sheet>.settings input{display:block}.sheet>.settings label{display:block}</style><button id="settingsFallback" type="button" aria-label="Settings">⚙</button><script>document.getElementById('settingsFallback').onclick=function(){var m=document.getElementById('settingsModal');if(m)m.classList.add('open')};</script>'''
          if 'id="settingsFallback"' not in s:
              s = s.replace(marker, patch + marker, 1)
          else:
              s = s.replace('</body>', patch + '</body>', 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BROK-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
